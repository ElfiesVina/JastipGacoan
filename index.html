<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover: konten boleh sampai tepi layar; jarak aman notch diatur di CSS lewat env(safe-area-inset-*) -->
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07758f">
<title>Titip Gacoan</title>

<!-- Font -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap">

<!-- CSS: urutan penting (variabel -> dasar -> layout -> komponen -> utilitas -> responsif terakhir) -->
<link rel="stylesheet" href="css/base/variables.css">
<link rel="stylesheet" href="css/base/reset.css">
<link rel="stylesheet" href="css/base/typography.css">
<link rel="stylesheet" href="css/layout/header.css">
<link rel="stylesheet" href="css/layout/main.css">
<link rel="stylesheet" href="css/components/card.css">
<link rel="stylesheet" href="css/components/form.css">
<link rel="stylesheet" href="css/components/button.css">
<link rel="stylesheet" href="css/components/choice.css">
<link rel="stylesheet" href="css/components/upload.css">
<link rel="stylesheet" href="css/components/list.css">
<link rel="stylesheet" href="css/components/toast.css">
<link rel="stylesheet" href="css/components/skeleton.css">
<link rel="stylesheet" href="css/components/changelog.css">
<link rel="stylesheet" href="css/components/dialog.css">
<link rel="stylesheet" href="css/utilities.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<!-- Header: logo, status sesi, lonceng changelog -->
<header>
  <div class="wrap">
    <div class="lg">Titip<b>Gacoan</b></div>
    <div class="hd">
      <div id="st"></div>
      <button id="bell" class="bell" type="button" data-act="cl" aria-label="Lihat yang baru">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9a6 6 0 0 1 12 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>
        <span id="bdg" hidden></span>
      </button>
    </div>
  </div>
</header>

<!-- Konten utama: #cl = teaser changelog, #app = halaman aktif (digambar oleh JS) -->
<main>
  <div id="cl"></div>
  <div id="app"></div>
  <noscript><div class="card">Halaman ini butuh JavaScript.</div></noscript>
</main>

<!-- Toast: pesan singkat -->
<div id="toast" role="status" aria-live="polite"></div>

<!-- Sheet changelog -->
<dialog id="dlg" aria-labelledby="dlt">
  <div class="shh"><h3 id="dlt">Yang baru</h3><button type="button" data-act="x">Tutup</button></div>
  <div class="shb" id="dl"></div>
</dialog>

<!-- Library Supabase (versi dikunci). Harus dimuat SEBELUM main.js -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<!-- Aplikasi (ES module) -->
<script type="module" src="js/main.js"></script>
</body>
</html>
