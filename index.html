<!-- Orientasi perangkat yang stabil: tinggi layar yang mengecil karena keyboard TIDAK dianggap landscape -->
<script>
(function(){
var d=document.documentElement;
/* laptop/PC asli (mouse/trackpad) -- TERMASUK jendela yang displit berdampingan -- dibedakan dari HP/tablet layar sentuh.
   Alasannya: di HP, orientasi dibaca dari LAYAR FISIK (bukan innerWidth/innerHeight) supaya tidak berubah saat keyboard
   membuat tinggi jendela mengecil. Tapi layar monitor laptop/PC selalu landscape walau JENDELA browsernya displit jadi
   sempit & tinggi (potret) -- kalau tetap dibaca dari layar fisik, jendela displit itu salah dianggap "landscape"
   dan memicu tata letak auth yang dirancang untuk HP rebah (pendek), jadi mengambang di tengah jendela yang tinggi.
   Maka untuk perangkat berpointer presisi, orientasi dibaca dari JENDELA (yang memang tidak diganggu keyboard virtual). */
var fine=matchMedia('(hover:hover) and (pointer:fine)').matches;
function u(){
  if(fine){d.dataset.orient=innerWidth>innerHeight?'land':'port';return}
  var o=screen.orientation&&screen.orientation.type;
  var l=o?o.indexOf('landscape')===0:(typeof orientation==='number'?Math.abs(orientation)===90:screen.width>screen.height);
  d.dataset.orient=l?'land':'port';
}
u();
/* tinggi layar "pendek" dihitung HANYA saat tidak mengetik, supaya keyboard tidak membuat tampilan menciut */
function h(){var a=document.activeElement;if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))return;if(innerHeight<=660)d.dataset.short='1';else delete d.dataset.short}h();
addEventListener('resize',function(){h();if(fine)u()});
addEventListener('focusout',function(){setTimeout(h,300)});
addEventListener('orientationchange',function(){setTimeout(u,150)});if(screen.orientation&&screen.orientation.addEventListener)screen.orientation.addEventListener('change',u)})();
</script>

<!-- Header: logo, status sesi, lonceng changelog -->

        <span class="i-moon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7z"/></svg></span>
        <span class="i-sun"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.2M12 19.3v2.2M4.9 4.9l1.6 1.6M17.5 17.5l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.9 19.1l1.6-1.6M17.5 6.5l1.6-1.6"/></svg></span>
      </button>

        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9a6 6 0 0 1 12 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>

    </div>

</main>

<dialog id="dlg" aria-labelledby="dlt">

</dialog>

      }).catch((err) => {
        console.warn('[PWA] Registrasi Service Worker gagal:', err);

    });

</script>
